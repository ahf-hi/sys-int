<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment QR Code</title>
    <link rel="stylesheet" href="../css/form.css">
    <style>
        /* Layout to position content at Center-Right */
        body {
            display: flex;
            justify-content: flex-end; /* Aligns to the right */
            align-items: center;      /* Centers vertically */
            min-height: 100vh;
            margin: 0;
            padding-right: 10%;       /* Offset from the very edge */
            background-color: #f4f4f9; /* Matches your body style */
        }

        .payment-container {
            width: 400px;
            max-width: 90%;
            text-align: center;
        }

        /* QR Specific styling to be added to form.css or kept here */
        .qr-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #qr-code-image {
            width: 250px;
            height: 250px;
            margin: 20px auto;
            display: none; /* Shown by JS */
            border: 1px solid #eee;
        }

        .timer-display {
            font-size: 32px;
            font-weight: bold;
            color: #d9534f;
            font-family: 'Courier New', Courier, monospace;
            margin: 10px 0;
        }

        .instruction-text {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <h1 id="h1_style" style="margin-bottom: 20px; border-radius: 8px;">Scan to Pay</h1>
        
        <div class="qr-card" id="qr-section" style="display: none;">
            <p class="instruction-text">Please scan this QR with your DuitNow account.</p>
            
            <img id="qr-code-image" src="" alt="Payment QR">
            
            <div class="timer-label" style="color: #666; font-size: 12px; text-transform: uppercase;">
                Valid for:
            </div>
            <div id="countdown-display" class="timer-display">00:00</div>
            
            <p style="font-size: 13px; color: #888; margin-top: 15px;">
                Reference ID: <span id="ref-id">--</span>
            </p>
        </div>

        <div id="error-box" style="display: none; color: red; background: white; padding: 20px; border-radius: 8px;">
            <h3>Data Missing</h3>
            <p>Unable to load payment information. Please return to the previous page.</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. Get data from URL (passed by callback.js)
            const params = new URLSearchParams(window.location.search);
            const qrData = params.get('MPI_QR_CODE');
            const expiry = params.get('MPI_QR_EXPIRY_SECONDS');
            
            // Optional: display a reference if you pass it in queryParams
            const ref = params.get('MPI_TXN_ID') || "N/A";
            document.getElementById('ref-id').textContent = ref;

            if (qrData && expiry) {
                startPaymentFlow(qrData, expiry);
            } else {
                document.getElementById('error-box').style.display = 'block';
            }
        };

        function startPaymentFlow(base64, seconds) {
            const qrImg = document.getElementById('qr-code-image');
            const display = document.getElementById('countdown-display');
            const section = document.getElementById('qr-section');

            // 2. Set QR Image
            qrImg.src = "data:image/png;base64," + base64;
            qrImg.style.display = "block";
            section.style.display = "block";

            // 3. Countdown logic
            let timeLeft = parseInt(seconds);

            const timer = setInterval(() => {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;

                // Display as mm:ss
                display.textContent = 
                    (mins < 10 ? "0" + mins : mins) + ":" + 
                    (secs < 10 ? "0" + secs : secs);

                if (--timeLeft < 0) {
                    clearInterval(timer);
                    display.textContent = "EXPIRED";
                    display.style.color = "#aaa";
                    qrImg.style.filter = "grayscale(100%) blur(2px)";
                    qrImg.style.opacity = "0.3";
                }
            }, 1000);
        }
    </script>

</body>
</html>
