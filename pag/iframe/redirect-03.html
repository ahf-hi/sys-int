<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Status Inquiry</title>
    <link rel="stylesheet" href="../css/form.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; font-family: sans-serif; }
        .payment-container { width: 400px; text-align: center; }
        .qr-card { background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #ccc; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-check { margin-top: 10px; padding: 12px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-check:hover { background: #333; }
        #qr-code-image { width: 200px; height: 200px; margin: 10px auto; display: none; }
    </style>
</head>
<body>

    <div class="payment-container">
        <h2>Check Payment Status</h2>
        <div class="qr-card">
            <div id="qr-display-area">
                <img id="qr-code-image" src="">
                <p id="ref-display" style="font-size: 13px; color: #666;"></p>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <div class="input-group">
                <label>ORIGINAL TRANSACTION ID</label>
                <input type="text" id="manual_trxn_id" placeholder="e.g. PAGUAT2026...">
            </div>

            <div class="input-group">
                <label>AMOUNT (IN CENTS)</label>
                <input type="number" id="manual_amount" placeholder="e.g. 100 for RM1.00">
            </div>

            <button class="btn-check" onclick="triggerInquiry()">Check Status Now</button>
            <p id="inquiry-status-text" style="font-size: 14px; color: #007bff; margin-top: 10px;"></p>
        </div>
    </div>

    <form id="inq-form" method="post" action="https://devlinkv2.paydee.co/mpigw/mercReq" target="inq_frame" style="display:none;">
        <input type="hidden" name="MPI_RETURN_URL" value="https://sys-int-nine.vercel.app/api/callback">
        <input type="hidden" name="MPI_TRANS_TYPE" value="INQ">
        <input type="hidden" name="MPI_MERC_ID" value="000000000000006">
        <input type="hidden" name="MPI_PURCH_DATE" id="INQ_PURCH_DATE">
        <input type="hidden" name="MPI_TRXN_ID" id="INQ_TRXN_ID">
        <input type="hidden" name="MPI_ORI_TRXN_ID" id="INQ_ORI_TRXN_ID">
        <input type="hidden" name="MPI_PURCH_CURR" value="458">
        <input type="hidden" name="MPI_PURCH_AMT" id="INQ_PURCH_AMT">
        <textarea name="MPI_MAC" id="INQ_MAC"></textarea>
    </form>
    <iframe name="inq_frame" style="display:none;"></iframe>

    <script src="inquiry-handler.js"></script>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const qr = params.get('MPI_QR_CODE');
            const tid = params.get('MPI_TRXN_ID') || params.get('MPI_TXN_ID');
            const amt = params.get('MPI_PURCH_AMT');

            // Auto-fill inputs if data IS in the URL
            if (tid) document.getElementById('manual_trxn_id').value = tid;
            if (amt) document.getElementById('manual_amount').value = amt;

            if (qr) {
                document.getElementById('qr-code-image').src = "data:image/png;base64," + qr;
                document.getElementById('qr-code-image').style.display = "block";
                document.getElementById('ref-display').innerText = "Ref: " + tid;
            }
        };
    </script>
</body>
</html>
