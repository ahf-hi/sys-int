<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/form.css">
    <title>Payment Page</title>
</head>
<body> 
    <div class="controls">
        <form id="form" method="post" action="">
            <input type="hidden" name="MPI_RETURN_URL" id="MPI_RETURN_URL" value="">

            <label for="MPI_TRANS_TYPE">MPI_TRANS_TYPE (Transaction Type):</label>
            <select name="MPI_TRANS_TYPE" id="MPI_TRANS_TYPE">
                <option value="SALES">SALES</option>
                <option value="INITRECURR">INITRECURR</option>
                <option value="PRERECURR">PRERECURR</option>
                <option value="PREAUTH">PREAUTH</option>
            </select>

            <label for="MPI_MERC_ID">MPI_MERC_ID (MID):</label>
            <input type="text" name="MPI_MERC_ID" id="MPI_MERC_ID" maxlength="15">

            <label for="MPI_PURCH_DATE">MPI_PURCH_DATE (Datetime) :</label>
            <input type="text" name="MPI_PURCH_DATE" id="MPI_PURCH_DATE" maxlength="14">

            <label for="MPI_TRXN_ID">MPI_TRXN_ID (Transaction ID):</label>
            <input type="text" name="MPI_TRXN_ID" id="MPI_TRXN_ID" maxlength="20">

            <label for="MPI_PURCH_CURR">MPI_PURCH_CURR (Currency: MYR only):</label>
            <input type="text" name="MPI_PURCH_CURR" id="MPI_PURCH_CURR" value='458' maxlength="3">

            <label for="MPI_PURCH_AMT">MPI_PURCH_AMT (Amount):</label>
            <input type="text" name="MPI_PURCH_AMT" id="MPI_PURCH_AMT" maxlength="19">

            <label for="MPI_RESPONSE_TYPE">MPI_RESPONSE_TYPE:</label>
            <select name="MPI_RESPONSE_TYPE" id="MPI_RESPONSE_TYPE">
                <option value=""></option>
                <option value="JSON">JSON</option>
                <option value="STRING">STRING</option>
            </select>
            
            <label for="MPI_PAYMENT_CHANNEL_ID">MPI_PAYMENT_CHANNEL_ID:</label>
            <input type="text" name="MPI_PAYMENT_CHANNEL_ID" id="MPI_PAYMENT_CHANNEL_ID" maxlength="30">

            <label for="MPI_MAC">MPI_MAC (Signed MAC) :</label>
            <textarea name="MPI_MAC" id="MPI_MAC" maxlength="344" rows="5" cols="100"></textarea>
        </form>

        <hr>
        <button type="button" id="sign-btn" onclick="autoSign()">Sign MAC</button>
        <button type="button" onclick="trim_mac()">Trim MAC (Manual)</button>
        <br><br>

        <button type="button" onclick="mkReq()">Key Exchange</button>
        <button type="button" id="pay-btn" onclick="mpReq()">Pay</button>
        <br><br>

        <form id="redirect-form" method="POST" style="display:none;"></form>
    </div>

    <script>
        // --- CONFIGURATION ---
        const KEY_EXCHANGE_URL = "https://devlinkv2.paydee.co/mpigw/mkReq";
        const PAYMENT_REQUEST_URL = "https://devlinkv2.paydee.co/mpigw/mpReq";
        const VERCEL_CALLBACK_URL = "https://sys-int-nine.vercel.app/api/callback";
        const VERCEL_SIGN_URL = "https://sys-int-nine.vercel.app/api/sign";
        const PUBLICKEY = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAq8j2SHHfzMLlhYppnlk-QqjjjZwMkhK6s6rERd0JhhY_6-Md4Z0327uEdfNbJrSEPJVPT55gjRhx4MorEhrabuafuY8thSPS4epwkOjjPtELwZxViWe1dzG5TQakJ_i8ZOQuUYFJg02RcwUTzE3ty-x7mkwj9t2wAdRqTagyaDIAVMTxP_Y4AS76xjA3aH43Q0HKHGAxxIlXBIQxImuPhlUbPtVtTHIsUwkIx2BDh8kPZ3Mgr3Cyky0F-cHpEFSi3rPSSLD_FVHlJRW2cODVm8E-s98CURQYs1npzDztzZgZPnnb9K57CB2Z50Ve6qUV7z4-uHs3nehiMJHktIs7LQIDAQAB";

        /**
         * AUTO SIGN - Calls Vercel to generate SHA256withRSA Base64Url MAC
         */
        async function autoSign() {
            const signBtn = document.getElementById("sign-btn");
            const rawString = 
                document.getElementById("MPI_TRANS_TYPE").value + 
                document.getElementById("MPI_MERC_ID").value + 
                document.getElementById("MPI_TRXN_ID").value +
                document.getElementById("MPI_PURCH_DATE").value +
                document.getElementById("MPI_PURCH_CURR").value +
                document.getElementById("MPI_PURCH_AMT").value +
                (document.getElementById("MPI_RESPONSE_TYPE").value || "") +
                (document.getElementById("MPI_PAYMENT_CHANNEL_ID").value || "");

            signBtn.innerText = "Signing...";

            try {
                const response = await fetch(VERCEL_SIGN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dataToSign: rawString })
                });

                const result = await response.json();
                if (result.mpi_mac) {
                    document.getElementById("MPI_MAC").value = result.mpi_mac;
                    signBtn.innerText = "✅ Signed";
                    console.log("MAC generated successfully.");
                } else {
                    alert("Signing Error: " + (result.error || "Check Vercel logs"));
                    signBtn.innerText = "Sign MAC";
                }
            } catch (error) {
                console.error("Signing error:", error);
                alert("Could not connect to signing API.");
                signBtn.innerText = "Sign MAC";
            }
        }

        /**
         * MP REQ - Main Submission
         */
        async function mpReq() {
            const form = document.getElementById("form");
            const payButton = document.getElementById("pay-btn");
            const responseType = document.getElementById("MPI_RESPONSE_TYPE").value;

            document.getElementById("MPI_RETURN_URL").value = VERCEL_CALLBACK_URL;
            
            // Disable empty fields for Gateway requirements
            const inputs = form.querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if (!input.value.trim()) input.disabled = true;
            });

            // CASE A: Standard Browser Redirect
            if (!responseType) {
                payButton.disabled = true;
                payButton.innerText = "Redirecting...";
                form.submit();
                return; 
            }

            // CASE B: Fetch JSON and Forward to Vercel
            payButton.disabled = true;
            payButton.innerText = "Processing...";

            inputs.forEach(input => input.disabled = false); // Re-enable for FormData
            const formData = new FormData(form);
            const payload = new URLSearchParams();
            formData.forEach((value, key) => {
                if (value.trim() !== "") payload.append(key, value);
            });

            try {
                const response = await fetch(PAYMENT_REQUEST_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload
                });

                const data = await response.json();

                // Build hidden form to POST response data to Vercel Callback
                const callbackForm = document.getElementById("redirect-form");
                callbackForm.action = VERCEL_CALLBACK_URL; 
                callbackForm.innerHTML = ""; 

                Object.keys(data).forEach(key => {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = key;
                    input.value = typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key];
                    callbackForm.appendChild(input);
                });

                callbackForm.submit();

            } catch (error) {
                console.error('Error:', error);
                alert("Fetch failed (CORS restriction). Use empty Response Type.");
                payButton.disabled = false;
                payButton.innerText = "Pay";
            }
        }

        /**
         * MK REQ - Key Exchange
         */
        async function mkReq() {
            let MID = document.getElementById("MPI_MERC_ID").value;
            let transactionID = document.getElementById("MPI_TRXN_ID").value;

            const raw = JSON.stringify({
                "merchantId": MID,
                "pubKey": PUBLICKEY,
                "purchaseId": transactionID
            });

            try {
                const response = await fetch(KEY_EXCHANGE_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: raw
                });
                const result = await response.json(); 

                if (result.errorCode === "000") {
                    alert(`✅ Success!\nCode: ${result.errorCode}\nMessage: ${result.errorMessage || 'Key Exchange successful.'}`);
                } else {
                    alert(`❌ Failed: ${result.errorCode}`);
                }
            } catch (error) {
                alert("Connection Blocked: Check CORS.");
            }
        }

        /**
         * UTILITIES
         */
        function trim_mac() {
            let macElement = document.getElementById("MPI_MAC");
            macElement.value = macElement.value
                .replace(/[+]/g, "-")
                .replace(/[/]/g, "_")
                .replace(/[=]/g, "");
        }

        function initFields() {
            let d = new Date();
            let x = d.getFullYear() + 
                    (d.getMonth() + 1).toString().padStart(2, '0') + 
                    d.getDate().toString().padStart(2, '0') + 
                    d.getHours().toString().padStart(2, '0') + 
                    d.getMinutes().toString().padStart(2, '0') + 
                    d.getSeconds().toString().padStart(2, '0');
            
            document.getElementById("MPI_PURCH_DATE").value = x;
            document.getElementById("MPI_TRXN_ID").value = "PAGUAT" + x;
        }

        initFields();
    </script>
</body>
</html>
