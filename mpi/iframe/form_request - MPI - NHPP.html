<!DOCTYPE html>
<html>

<div class="controls">
<body> 

 <form id="form" method="post" action="" >


   <label for="MPI_TRANS_TYPE">MPI_TRANS_TYPE (Transaction Type):</label>
	<select type="text" name="MPI_TRANS_TYPE">
      <option value="SALES">SALES</option>
      <option value="INITRECURR">INITRECURR</option>
      <option value="PRERECURR">PRERECURR</option>
	  <option value="RECURR">RECURR</option>
      <option value="INQ">INQ</option>
      <option value="VSALES">VSALES</option>
      <option value="REFUND">REFUND</option>
      <option value="PREAUTH">PREAUTH</option>
      <option value="SALESCOMPL">SALESCOMPL</option>
      <option value="TERMINATE">TERMINATE</option> 
    </select>
	
	<label for="MPI_MERC_ID">MPI_MERC_ID (MID):</label>
    <input type="text" name="MPI_MERC_ID" maxlength="15" >
	
	<label for="MPI_PAN">MPI_PAN (Card Number):</label>
    <input type="text" name="MPI_PAN" maxlength="19" >
	
	<label for="MPI_PAN_EXP">MPI_PAN_EXP (Card Expiry, YYMM):</label>
    <input type="text" name="MPI_PAN_EXP" maxlength="4" >
	
	<label for="MPI_CVV2">MPI_CVV2 (CVV2):</label>
    <input type="text" name="MPI_CVV2" maxlength="3" >
   
	<label for="MPI_CARD_HOLDER_NAME">MPI_CARD_HOLDER_NAME (Cardholder Name):</label>
    <input type="text" name="MPI_CARD_HOLDER_NAME" maxlength="45" >
	
	<label for="MPI_PURCH_DATE">MPI_PURCH_DATE (Datetime):</label>
    <input type="text" name="MPI_PURCH_DATE" maxlength="14" >
	
	<label for="MPI_TRXN_ID">MPI_TRXN_ID (Transaction ID):</label>
    <input type="text" name="MPI_TRXN_ID" maxlength="20" >
	
	<label for="MPI_ORI_TRXN_ID">MPI_ORI_TRXN_ID (Original Transaction ID):</label>
    <input type="text" name="MPI_ORI_TRXN_ID" maxlength="20" >

	<label for="MPI_PURCH_CURR">MPI_PURCH_CURR (Currency: MYR only)):</label>
    <input type="text" name="MPI_PURCH_CURR" value = '458' maxlength="3" >
	
	<label for="MPI_PURCH_AMT">MPI_PURCH_AMT (Amount):</label>
    <input type="text" name="MPI_PURCH_AMT" maxlength="19" >
	
    <label for="MPI_RESPONSE_TYPE">MPI_RESPONSE_TYPE:</label>
        <select name="MPI_RESPONSE_TYPE" id="MPI_RESPONSE_TYPE">
            <option value=""></option>
            <option value="JSON">JSON</option>
            <option value="STRING">STRING</option>
        </select>
			
    <label for="MPI_ADDITIONAL_INFO_IND">MPI_ADDITIONAL_INFO_IND:</label>
        <select name="MPI_ADDITIONAL_INFO_IND" id="MPI_ADDITIONAL_INFO_IND">
            <option value=""></option>
            <option value="Y">Y</option>
        </select>
			
			
	<label for="MPI_MAC"> MPI_MAC (Signed MAC):</label>
    <textarea type="text" name="MPI_MAC" maxlength="344" rows="5" cols="90" ></textarea>

 </form>
        <hr>
        <button onclick="clear_mac()">Clear MAC</button><br>
        <textarea id="mac" rows="1" cols="90" readonly></textarea><br> 

        <button onclick="trim_mac()">Trim MAC</button><br><br>

        <button onclick="mkReq()">Key Exchange</button>
        <button type="button" onclick="mpReq()">Pay</button><br><br>

        <form id="redirect-form" method="POST" style="display:none;"></form>
    </div>


 <script>
        // --- CONFIGURATION ---
        const KEY_EXCHANGE_URL = "https://sys-int-nine.vercel.app/api/key-exchange";
        const PAYMENT_REQUEST_URL = "https://devlink.paydee.co/mpi/mpReq";
        const GET_CHANNEL_URL = "https://devlinkv2.paydee.co/mpigw/channels";
        const PUBLICKEY = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAq8j2SHHfzMLlhYppnlk-QqjjjZwMkhK6s6rERd0JhhY_6-Md4Z0327uEdfNbJrSEPJVPT55gjRhx4MorEhrabuafuY8thSPS4epwkOjjPtELwZxViWe1dzG5TQakJ_i8ZOQuUYFJg02RcwUTzE3ty-x7mkwj9t2wAdRqTagyaDIAVMTxP_Y4AS76xjA3aH43Q0HKHGAxxIlXBIQxImuPhlUbPtVtTHIsUwkIx2BDh8kPZ3Mgr3Cyky0F-cHpEFSi3rPSSLD_FVHlJRW2cODVm8E-s98CURQYs1npzDztzZgZPnnb9K57CB2Z50Ve6qUV7z4-uHs3nehiMJHktIs7LQIDAQAB";
		const VERCEL_CALLBACK_URL = "https://sys-int-nine.vercel.app/api/callback"


        // Initialize form action
        document.getElementById("form").action = PAYMENT_REQUEST_URL;

        /**
         * MP REQ - Main Payment Submission
         * Uses native form submission to Gateway to avoid CORS errors.
         */
async function mpReq() {
    const form = document.getElementById("form");
    const payButton = document.querySelector("button[onclick='mpReq()']");
    const responseType = document.getElementById("MPI_RESPONSE_TYPE").value;

    // 1. Prepare fields (Set Return URL and handle empty fields)
    document.getElementById("MPI_RETURN_URL").value = VERCEL_CALLBACK_URL;
    
    const inputs = form.querySelectorAll('input, select, textarea');
    inputs.forEach(input => {
        if (!input.value.trim()) {
            input.disabled = true; // Essential for correct MAC generation on server
        }
    });

    // --- CASE A: Standard Form Redirect (No Response Type) ---
    if (!responseType) {
        payButton.disabled = true;
        payButton.innerText = "Redirecting to Gateway...";
        form.submit();
        
        // Re-enable for UI consistency if they hit 'back'
        setTimeout(() => {
            inputs.forEach(input => input.disabled = false);
            payButton.disabled = false;
            payButton.innerText = "Pay";
        }, 2000);
        return; 
    }

    // --- CASE B: Capture JSON and Forward (JSON/STRING Response Type) ---
    payButton.disabled = true;
    payButton.innerText = "Processing JSON...";

    // Re-enable temporarily to gather data for fetch
    inputs.forEach(input => input.disabled = false);
    const formData = new FormData(form);
    const payload = new URLSearchParams();
    
    formData.forEach((value, key) => {
        if (value.trim() !== "") payload.append(key, value);
    });

try {
    const response = await fetch(PAYMENT_REQUEST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: payload
    });

    const data = await response.json();

    // --- REDIRECT LOGIC ---
    const callbackForm = document.getElementById("redirect-form");
    
    // FORCE the action to use your Vercel URL from config
    callbackForm.action = VERCEL_CALLBACK_URL; 
    callbackForm.method = "POST";
    callbackForm.innerHTML = ""; 

    Object.keys(data).forEach(key => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = typeof data[key] === 'object' ? JSON.stringify(data[key]) : data[key];
        callbackForm.appendChild(input);
    });

    // Now this will POST to Vercel, not GitHub!
    callbackForm.submit();

} catch (error) {
    console.error('Error:', error);
    alert("Fetch failed. Check CORS or network.");
}
}


/**
* MK REQ - Key Exchange
* Handles the background communication for keys.
*/
async function mkReq() {
    let MID = document.forms["form"]["MPI_MERC_ID"].value;
    let transactionID = document.forms["form"]["MPI_TRXN_ID"].value;

    const raw = JSON.stringify({
        "merchantId": MID,
        "pubKey": PUBLICKEY,
        "purchaseId": transactionID
    });

    try {
        const response = await fetch(KEY_EXCHANGE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: raw
        });

        const result = await response.json(); 

        if (result.errorCode === "000") {
            alert(`✅ Success!\nCode: ${result.errorCode}\nMessage: ${result.errorMessage || 'Key Exchange successful.'}`);
        } else {
            alert(`❌ Failed\nCode: ${result.errorCode}\nMessage: ${result.errorMessage}`);
        }
    } catch (error) {
        console.error('Error:', error);
        alert("⚠️ Proxy Error: Check Vercel logs.");
    }
}

        /**
         * MAC UTILITIES
         */
		function clear_mac() 
			{
				document.getElementById("mac").innerHTML = 
  				  document.forms["form"]["MPI_TRANS_TYPE"].value 
  				+ document.forms["form"]["MPI_MERC_ID"].value 
  				+ document.forms["form"]["MPI_PAN"].value 
  				+ document.forms["form"]["MPI_CARD_HOLDER_NAME"].value 
  				+ document.forms["form"]["MPI_PAN_EXP"].value 
  				+ document.forms["form"]["MPI_CVV2"].value 
  				+ document.forms["form"]["MPI_TRXN_ID"].value
  				+ document.forms["form"]["MPI_ORI_TRXN_ID"].value
  				+ document.forms["form"]["MPI_PURCH_DATE"].value
  				+ document.forms["form"]["MPI_PURCH_CURR"].value
  				+ document.forms["form"]["MPI_PURCH_AMT"].value
				+ document.forms["form"]["MPI_RESPONSE_TYPE"].value
                + document.forms["form"]["MPI_ADDITIONAL_INFO_IND"].value;
			}

        function trim_mac() {
            let macElement = document.forms["form"]["MPI_MAC"];
            let rawMac = macElement.value;
            let trimmedMac = rawMac.replace(/[+]/g, "-")
                                   .replace(/[/]/g, "_")
                                   .replace(/[=]/g, "");
            macElement.value = trimmedMac;
        }

        /**
         * DATE & ID INITIALIZATION
         */
        function initFields() {
            let d = new Date();
            let x = d.getFullYear() + 
                    (d.getMonth() + 1).toString().padStart(2, '0') + 
                    d.getDate().toString().padStart(2, '0') + 
                    d.getHours().toString().padStart(2, '0') + 
                    d.getMinutes().toString().padStart(2, '0') + 
                    d.getSeconds().toString().padStart(2, '0');
            
            document.forms["form"]["MPI_PURCH_DATE"].value = x;
            document.forms["form"]["MPI_TRXN_ID"].value = "MPIUAT" + x;
        }

        // Run on load
        initFields();

    </script>
</body>
